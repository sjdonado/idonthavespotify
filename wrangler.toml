name = "idonthavespotify"
main = "dist/workers.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Static files (assets, favicon, llms.txt) served by the platform;
# dynamic routes fall through to the worker entry.
[assets]
directory = "./public"

[vars]
DISABLE_API_SEARCH = "true"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["QuotaDO"]

[[migrations]]
tag = "v2-remove-quota"
deleted_classes = ["QuotaDO"]
